<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>JellyQuest Requests</title>
  <style>
    * { box-sizing: border-box; }
    html, body { background: #111827; color: #f9fafb; height: 100%; margin: 0; font-family: Inter, Arial, sans-serif; }
    body { overflow: hidden; }
    body { font-size: 20px; }
    button, input { font: inherit; }
    button { color: #fff; }
    body:before { background: linear-gradient(135deg, #1f2937 0%, #111827 55%); content: ''; height: 20rem; left: 17rem; pointer-events: none; position: fixed; right: 0; top: 0; }
    button:focus, input:focus { border-color: #c4b5fd !important; box-shadow: 0 0 0 .18rem #6366f1, 0 .35rem 1rem rgba(0, 0, 0, .55); outline: none; }
    header { background: linear-gradient(180deg, #1f2937 0%, #131928 100%); border-right: .08rem solid #374151; bottom: 0; display: flex; flex-direction: column; left: 0; padding: 1.5rem 1rem; position: fixed; top: 0; width: 17rem; z-index: 4; }
    .brand { background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; color: transparent; font-size: 2.1rem; font-weight: 800; letter-spacing: -.04rem; margin: .7rem .75rem 3rem; white-space: nowrap; }
    .brand small { color: #9ca3af; display: block; font-size: .85rem; font-weight: 600; letter-spacing: .16rem; margin-top: .25rem; text-transform: uppercase; }
    .nav { align-items: center; background: transparent; border: .12rem solid transparent; border-radius: .45rem; display: flex; font-size: 1.25rem; font-weight: 600; margin: 0 0 .8rem; padding: .8rem .9rem; text-align: left; width: 100%; }
    .nav-icon { color: #9ca3af; display: inline-block; font-size: 1.35rem; margin-right: .85rem; text-align: center; width: 1.6rem; }
    .nav.active { background: linear-gradient(135deg, #4f46e5, #9333ea); color: #fff; }
    .nav.active .nav-icon { color: #fff; }
    .nav.back { color: #d1d5db; margin-top: auto; }
    #topbar { align-items: center; background: rgba(31, 41, 55, .78); border-bottom: .08rem solid rgba(75, 85, 99, .55); display: none; height: 5.25rem; left: 17rem; padding: 0 2rem; position: fixed; right: 0; top: 0; z-index: 3; }
    #topPageTitle { color: #f3f4f6; font-size: 1.45rem; font-weight: 700; min-width: 15rem; }
    #globalSearchForm { display: flex; flex: 1; justify-content: center; }
    #globalSearch { background: rgba(17, 24, 39, .78); border: .1rem solid #4b5563; border-radius: .5rem; color: #fff; font-size: 1.15rem; max-width: 38rem; padding: .75rem 1rem; width: 100%; }
    .profile-dot { align-items: center; background: linear-gradient(135deg, #4f46e5, #9333ea); border-radius: 50%; display: flex; font-size: .9rem; font-weight: 800; height: 2.8rem; justify-content: center; margin-left: 1.5rem; width: 2.8rem; }
    #status { align-items: center; display: flex; font-size: 1.4rem; height: 100%; justify-content: center; margin-left: 17rem; padding: 2rem; position: relative; text-align: center; }
    #retry { background: linear-gradient(135deg, #4f46e5, #9333ea); border: .12rem solid transparent; border-radius: .45rem; display: none; margin: 1.25rem auto 0; padding: .7rem 1.1rem; }
    #app { display: none; height: 100%; margin-left: 17rem; overflow-y: auto; padding: 6.6rem 2rem 5rem; position: relative; scroll-behavior: smooth; }
    h2 { font-size: 1.85rem; font-weight: 500; margin: 0 0 1.2rem; }
    .search-row { display: flex; margin-bottom: 1.5rem; max-width: 58rem; }
    #searchInput { background: #1f2937; border: .12rem solid #4b5563; border-radius: .4rem 0 0 .4rem; color: #fff; flex: 1; font-size: 1.35rem; min-width: 0; padding: .9rem 1.1rem; }
    #searchButton { background: linear-gradient(135deg, #4f46e5, #7e22ce); border: .12rem solid transparent; border-radius: 0 .4rem .4rem 0; padding: .8rem 1.4rem; }
    #messageBar { background: #1f2937; border: .1rem solid #374151; border-left: .3rem solid #6366f1; border-radius: .35rem; display: none; margin-bottom: 1.2rem; padding: .8rem 1rem; }
    .media-row { margin-bottom: 1.7rem; }
    .row-header { align-items: center; display: flex; height: 2.8rem; justify-content: space-between; }
    .row-header h2 { color: #d1d5db; font-size: 1.6rem; font-weight: 700; margin: 0; }
    .see-more { background: transparent; border: .12rem solid transparent; border-radius: .35rem; color: #a5b4fc; font-size: 1.1rem; font-weight: 600; padding: .45rem .7rem; }
    .row-scroller { display: flex; margin: 0 -.5rem; overflow: hidden; padding: .35rem .5rem .55rem; }
    .cards { display: flex; flex-wrap: wrap; margin: 0 -.55rem; }
    .card { background: #1f2937; border: .1rem solid #374151; border-radius: .75rem; color: #fff; flex: 0 0 auto; height: 20rem; margin: 0 .5rem; overflow: hidden; padding: 0; position: relative; text-align: left; width: 11.5rem; }
    .cards .card { margin: 0 .55rem 1.1rem; }
    .card:focus { transform: scale(1.045); }
    .poster { background: linear-gradient(145deg, #374151, #111827); display: block; height: 100%; object-fit: cover; width: 100%; }
    .poster-missing { align-items: center; color: #d6d6d6; display: flex; font-size: 1.15rem; font-weight: 600; justify-content: center; padding: 1rem; text-align: center; }
    .card-copy { background: linear-gradient(180deg, transparent 0%, rgba(17, 24, 39, .88) 30%, #111827 100%); bottom: 0; display: block; left: 0; min-height: 7rem; padding: 2rem .8rem .75rem; position: absolute; right: 0; }
    .title { display: block; font-size: 1.15rem; font-weight: 700; line-height: 1.2; max-height: 2.8rem; overflow: hidden; }
    .meta { color: #d1d5db; display: block; font-size: .92rem; margin-top: .3rem; }
    .badge { background: #4f46e5; border: .08rem solid #818cf8; border-radius: 2rem; color: #fff; display: inline-block; font-size: .75rem; font-weight: 700; margin-top: .4rem; padding: .18rem .48rem; text-transform: uppercase; }
    .badge.available { background: #047857; border-color: #34d399; }
    .badge.pending { background: #b45309; border-color: #fbbf24; }
    .type-badge { background: rgba(37, 99, 235, .88); border: .08rem solid #60a5fa; border-radius: 2rem; font-size: .72rem; font-weight: 800; left: .55rem; padding: .22rem .5rem; position: absolute; text-transform: uppercase; top: .55rem; z-index: 1; }
    .type-badge.tv { background: rgba(126, 34, 206, .9); border-color: #c084fc; }
    .option-card { align-items: center; background: linear-gradient(145deg, #4338ca, #7e22ce); border: .1rem solid #6366f1; border-radius: .75rem; box-shadow: inset 0 0 4rem rgba(17, 24, 39, .35); color: #fff; display: flex; flex: 0 0 auto; font-size: 1.35rem; font-weight: 700; height: 9rem; justify-content: center; margin: 0 .5rem; padding: 1rem; text-align: center; width: 15rem; }
    .cards .option-card { margin: 0 .55rem 1.1rem; }
    .empty { color: #bbb; font-size: 1.15rem; padding: 2rem 0; }
    .loading-row { align-items: center; color: #aaa; display: flex; font-size: 1.1rem; height: 21.5rem; padding-left: .5rem; }
    .section-heading { align-items: center; display: flex; margin-bottom: 1.1rem; }
    .section-heading h2 { margin: 0; }
    .section-heading button { background: #333; border: .12rem solid transparent; border-radius: .35rem; margin-right: 1rem; padding: .6rem .85rem; }
    #modal { align-items: center; background: rgba(0, 0, 0, .82); bottom: 0; display: none; justify-content: center; left: 0; padding: 2rem; position: fixed; right: 0; top: 0; z-index: 5; }
    .dialog { background: #1f2937; border: .1rem solid #4b5563; border-radius: .75rem; box-shadow: 0 .4rem 2rem #000; max-height: 88%; max-width: 52rem; overflow-y: auto; padding: 1.75rem; width: 100%; }
    .dialog h2 { margin-bottom: .7rem; }
    .dialog p { color: #ccc; line-height: 1.45; }
    .dialog-actions { margin-top: 1.25rem; text-align: right; }
    .dialog-actions button { background: #374151; border: .12rem solid transparent; border-radius: .4rem; margin-left: .7rem; padding: .7rem 1rem; }
    .dialog-actions .primary { background: linear-gradient(135deg, #4f46e5, #7e22ce); }
    .dialog-actions button:disabled { background: #333; color: #888; }
  </style>
</head>
<body>
  <header>
    <div class="brand">JellyQuest<small>Powered by Jellyseerr</small></div>
    <button class="nav active" id="discoverNav" type="button"><span class="nav-icon">✦</span>Discover</button>
    <button class="nav" id="moviesNav" type="button"><span class="nav-icon">▰</span>Movies</button>
    <button class="nav" id="tvNav" type="button"><span class="nav-icon">▣</span>TV Shows</button>
    <button class="nav" id="searchNav" type="button"><span class="nav-icon">⌕</span>Search</button>
    <button class="nav" id="requestsNav" type="button"><span class="nav-icon">◷</span>My Requests</button>
    <button class="nav back" id="back" type="button"><span class="nav-icon">←</span>Back to Jellyfin</button>
  </header>
  <div id="topbar">
    <div id="topPageTitle">Discover</div>
    <form id="globalSearchForm"><input id="globalSearch" type="search" maxlength="100" placeholder="Search movies and TV shows…" autocomplete="off"></form>
    <div class="profile-dot">JQ</div>
  </div>
  <main id="status">
    <div>
      <div id="message">Signing in with your Jellyfin profile&hellip;</div>
      <button id="retry" type="button">Try again</button>
    </div>
  </main>
  <main id="app">
    <div id="messageBar"></div>
    <section id="discoverView">
      <div id="discoverRows"></div>
    </section>
    <section id="categoryView" hidden>
      <div class="section-heading">
        <button id="categoryBack" type="button">&larr; Discover</button>
        <h2 id="categoryTitle"></h2>
      </div>
      <div class="cards" id="categoryCards"></div>
    </section>
    <section id="searchView" hidden>
      <h2>Search for something to request</h2>
      <form class="search-row" id="searchForm">
        <input id="searchInput" type="search" maxlength="100" placeholder="Movie or TV show" autocomplete="off">
        <button id="searchButton" type="submit">Search</button>
      </form>
      <div class="cards" id="searchCards"></div>
    </section>
    <section id="requestsView" hidden>
      <h2>My Requests</h2>
      <div class="cards" id="requestCards"></div>
    </section>
  </main>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="dialog">
      <h2 id="modalTitle"></h2>
      <div class="meta" id="modalMeta"></div>
      <p id="modalOverview"></p>
      <div class="dialog-actions">
        <button id="modalClose" type="button">Cancel</button>
        <button class="primary" id="modalRequest" type="button">Request</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      'use strict';

      var message = document.getElementById('message');
      var retry = document.getElementById('retry');
      var app = document.getElementById('app');
      var modal = document.getElementById('modal');
      var selectedItem = null;
      var lastFocusedCard = null;
      var activeView = 'discover';
      var activeCategory = null;
      var categoryCache = {};
      var isPreview = /(?:\?|&)preview=1(?:&|$)/.test(window.location.search);
      var params = {};
      var categories = [
        { key: 'recently-added', title: 'Recently Added', type: 'recentlyAdded' },
        { key: 'recent-requests', title: 'Recent Requests', type: 'recentRequests' },
        { key: 'trending', title: 'Trending', url: '/api/v1/discover/trending' },
        { key: 'popular-movies', title: 'Popular Movies', url: '/api/v1/discover/movies' },
        { key: 'movie-genres', title: 'Movie Genres', type: 'genres', mediaType: 'movie', url: '/api/v1/discover/genreslider/movie' },
        { key: 'upcoming-movies', title: 'Upcoming Movies', url: '/api/v1/discover/movies/upcoming' },
        { key: 'studios', title: 'Studios', type: 'options', mediaType: 'movie', items: [
          { id: 2, name: 'Disney' }, { id: 127928, name: '20th Century Studios' },
          { id: 34, name: 'Sony Pictures' }, { id: 174, name: 'Warner Bros.' },
          { id: 33, name: 'Universal' }, { id: 4, name: 'Paramount' },
          { id: 3, name: 'Pixar' }, { id: 521, name: 'DreamWorks' },
          { id: 420, name: 'Marvel Studios' }, { id: 41077, name: 'A24' }
        ] },
        { key: 'popular-tv', title: 'Popular TV Shows', url: '/api/v1/discover/tv' },
        { key: 'tv-genres', title: 'TV Genres', type: 'genres', mediaType: 'tv', url: '/api/v1/discover/genreslider/tv' },
        { key: 'upcoming-tv', title: 'Upcoming TV Shows', url: '/api/v1/discover/tv/upcoming' },
        { key: 'networks', title: 'Networks', type: 'options', mediaType: 'tv', items: [
          { id: 213, name: 'Netflix' }, { id: 2739, name: 'Disney+' },
          { id: 1024, name: 'Prime Video' }, { id: 2552, name: 'Apple TV+' },
          { id: 453, name: 'Hulu' }, { id: 49, name: 'HBO' },
          { id: 4353, name: 'Peacock' }, { id: 2, name: 'ABC' },
          { id: 19, name: 'FOX' }, { id: 174, name: 'AMC' }
        ] }
      ];

      window.location.hash.slice(1).split('&').forEach(function (part) {
        var separator = part.indexOf('=');
        if (separator > 0) {
          params[decodeURIComponent(part.slice(0, separator))] = decodeURIComponent(part.slice(separator + 1));
        }
      });
      window.history.replaceState(null, '', window.location.pathname + window.location.search);

      function isSafeReturnUrl(url) {
        return typeof url === 'string' && (
          /^file:\/\/\//.test(url) ||
          /^https:\/\/jelly-farmhouse\.starrgroup\.io(?:\/|$)/.test(url)
        );
      }

      function backToJellyQuest(event) {
        if (event) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
        if (isSafeReturnUrl(params.return)) {
          window.location.replace(params.return);
        } else {
          window.history.back();
        }
      }

      function handleBack(event) {
        var isBack = event.type === 'tizenhwkey'
          ? event.keyName === 'back'
          : event.keyCode === 10009 || event.keyCode === 8;
        if (isBack) {
          if (modal.style.display === 'flex') {
            event.preventDefault();
            event.stopImmediatePropagation();
            closeModal();
          } else if (activeCategory || activeView !== 'discover') {
            event.preventDefault();
            event.stopImmediatePropagation();
            showView('discover');
          } else {
            backToJellyQuest(event);
          }
        }
      }

      function isVisible(element) {
        return element.offsetWidth > 0 && element.offsetHeight > 0 && !element.disabled;
      }

      function focusableElements() {
        var root = modal.style.display === 'flex' ? modal : document.body;
        return Array.prototype.slice.call(root.querySelectorAll('button:not([disabled]), input:not([disabled])'))
          .filter(isVisible);
      }

      function moveFocus(direction, event) {
        var elements = focusableElements();
        var current = document.activeElement;
        var currentRect;
        var currentX;
        var currentY;
        var best = null;
        var bestScore = Infinity;

        if (!elements.length) return;
        if (elements.indexOf(current) === -1) {
          elements[0].focus();
          event.preventDefault();
          return;
        }
        if (current.tagName === 'INPUT' && (direction === 'left' || direction === 'right')) return;

        currentRect = current.getBoundingClientRect();
        currentX = currentRect.left + currentRect.width / 2;
        currentY = currentRect.top + currentRect.height / 2;

        elements.forEach(function (candidate) {
          var rect;
          var x;
          var y;
          var dx;
          var dy;
          var primary;
          var secondary;
          var score;
          if (candidate === current) return;
          rect = candidate.getBoundingClientRect();
          x = rect.left + rect.width / 2;
          y = rect.top + rect.height / 2;
          dx = x - currentX;
          dy = y - currentY;
          if ((direction === 'left' && dx >= -2) ||
              (direction === 'right' && dx <= 2) ||
              (direction === 'up' && dy >= -2) ||
              (direction === 'down' && dy <= 2)) return;
          primary = direction === 'left' || direction === 'right' ? Math.abs(dx) : Math.abs(dy);
          secondary = direction === 'left' || direction === 'right' ? Math.abs(dy) : Math.abs(dx);
          score = primary * 10 + secondary;
          if (score < bestScore) {
            bestScore = score;
            best = candidate;
          }
        });

        if (best) {
          event.preventDefault();
          event.stopImmediatePropagation();
          best.focus();
          try {
            best.scrollIntoView({ block: 'nearest', inline: 'nearest' });
          } catch (error) {
            best.scrollIntoView(false);
          }
        }
      }

      function handleDirectionalKey(event) {
        var directions = { 37: 'left', 38: 'up', 39: 'right', 40: 'down' };
        if (directions[event.keyCode]) moveFocus(directions[event.keyCode], event);
      }

      function showError(text) {
        message.textContent = text;
        retry.style.display = 'block';
        retry.focus();
      }

      function api(path, options) {
        if (isPreview) return Promise.resolve(previewApi(path, options));
        var requestOptions = options || {};
        requestOptions.credentials = 'same-origin';
        requestOptions.headers = requestOptions.headers || { 'Accept': 'application/json' };
        return fetch(path, requestOptions).then(function (response) {
          return response.text().then(function (text) {
            var data = text ? JSON.parse(text) : {};
            if (!response.ok || response.status === 202) {
              throw new Error(data.message || 'Jellyseerr returned ' + response.status + '.');
            }
            return data;
          });
        });
      }

      function notice(text) {
        var bar = document.getElementById('messageBar');
        bar.textContent = text;
        bar.style.display = text ? 'block' : 'none';
      }

      function itemTitle(item) {
        return item.title || item.name || 'Untitled';
      }

      function itemYear(item) {
        var date = item.releaseDate || item.firstAirDate || '';
        return date ? date.slice(0, 4) : '';
      }

      function mediaStatus(item) {
        var status = item.mediaInfo && item.mediaInfo.status;
        if (status === 5) return { text: 'Available', css: 'available', requestable: false };
        if (status === 2) return { text: 'Pending', css: 'pending', requestable: false };
        if (status === 3) return { text: 'Processing', css: 'pending', requestable: false };
        if (status === 4) return { text: 'Partially available', css: 'pending', requestable: true };
        if (status === 6) return { text: 'Unavailable', css: '', requestable: false };
        return { text: 'Request', css: '', requestable: true };
      }

      function createCard(item) {
        var button = document.createElement('button');
        var poster;
        var typeBadge = document.createElement('span');
        var copy = document.createElement('span');
        var title = document.createElement('span');
        var meta = document.createElement('span');
        var badge = document.createElement('span');
        var status = mediaStatus(item);
        button.type = 'button';
        button.className = 'card';
        typeBadge.className = 'type-badge ' + (item.mediaType === 'tv' ? 'tv' : 'movie');
        typeBadge.textContent = item.mediaType === 'tv' ? 'TV' : 'Movie';
        if (item.posterPath) {
          poster = document.createElement('img');
          poster.className = 'poster';
          poster.alt = '';
          poster.src = 'https://image.tmdb.org/t/p/w342' + item.posterPath;
        } else {
          poster = document.createElement('span');
          poster.className = 'poster poster-missing';
          poster.textContent = 'No artwork';
          if (item.previewColor) {
            poster.style.background = item.previewColor;
            poster.textContent = itemTitle(item);
          }
        }
        copy.className = 'card-copy';
        title.className = 'title';
        title.textContent = itemTitle(item);
        meta.className = 'meta';
        meta.textContent = (item.mediaType === 'tv' ? 'TV' : 'Movie') + (itemYear(item) ? ' · ' + itemYear(item) : '');
        badge.className = 'badge ' + status.css;
        badge.textContent = status.text;
        copy.appendChild(title);
        copy.appendChild(meta);
        copy.appendChild(badge);
        button.appendChild(poster);
        button.appendChild(typeBadge);
        button.appendChild(copy);
        button.addEventListener('click', function () {
          lastFocusedCard = button;
          openModal(item);
        });
        return button;
      }

      function createOptionCard(category, item) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'option-card';
        button.textContent = item.name;
        button.addEventListener('click', function () {
          var base;
          if (category.type === 'genres') {
            base = category.mediaType === 'tv' ? '/api/v1/discover/tv?genre=' : '/api/v1/discover/movies?genre=';
          } else {
            base = category.mediaType === 'tv' ? '/api/v1/discover/tv/network/' : '/api/v1/discover/movies/studio/';
          }
          openFilteredCategory(item.name, base + item.id);
        });
        return button;
      }

      function renderCards(containerId, items, emptyText) {
        var container = document.getElementById(containerId);
        container.innerHTML = '';
        if (!items.length) {
          var empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = emptyText;
          container.appendChild(empty);
          return;
        }
        items.forEach(function (item) { container.appendChild(createCard(item)); });
      }

      function categoryByKey(key) {
        return categories.filter(function (category) { return category.key === key; })[0];
      }

      function detailItems(items) {
        return Promise.all(items.map(function (item) {
          var media = item.media || item;
          var type = item.type || media.mediaType;
          var tmdbId = media.tmdbId || item.id;
          var path = type === 'tv' ? '/api/v1/tv/' : '/api/v1/movie/';
          return api(path + tmdbId).then(function (details) {
            details.mediaType = type;
            return details;
          }).catch(function () { return null; });
        })).then(function (details) {
          return details.filter(function (item) { return item; });
        });
      }

      function loadCategory(category) {
        if (categoryCache[category.key]) return Promise.resolve(categoryCache[category.key]);
        var request;
        if (category.type === 'recentlyAdded') {
          request = api('/api/v1/media?filter=allavailable&take=20&sort=mediaAdded')
            .then(function (data) { return detailItems(data.results); });
        } else if (category.type === 'recentRequests') {
          request = api('/api/v1/request?filter=all&take=20&sort=modified&skip=0')
            .then(function (data) { return detailItems(data.results); });
        } else if (category.type === 'genres') {
          request = api(category.url).then(function (items) { return items; });
        } else if (category.type === 'options') {
          request = Promise.resolve(category.items);
        } else {
          request = api(category.url + '?page=1').then(function (data) {
            return data.results.filter(function (item) {
              return item.mediaType === 'movie' || item.mediaType === 'tv';
            });
          });
        }
        return request.then(function (items) {
          categoryCache[category.key] = items;
          return items;
        });
      }

      function createMediaRow(category) {
        var row = document.createElement('section');
        var header = document.createElement('div');
        var title = document.createElement('h2');
        var more = document.createElement('button');
        var scroller = document.createElement('div');
        row.className = 'media-row';
        row.setAttribute('data-category', category.key);
        header.className = 'row-header';
        title.textContent = category.title;
        more.type = 'button';
        more.className = 'see-more';
        more.textContent = 'See More  →';
        more.addEventListener('click', function () { openCategory(category.key); });
        scroller.className = 'row-scroller';
        scroller.innerHTML = '<div class="loading-row">Loading…</div>';
        header.appendChild(title);
        header.appendChild(more);
        row.appendChild(header);
        row.appendChild(scroller);
        return row;
      }

      function populateMediaRow(category, items) {
        var scroller = document.querySelector('[data-category="' + category.key + '"] .row-scroller');
        if (!scroller) return;
        scroller.innerHTML = '';
        if (!items.length) {
          scroller.innerHTML = '<div class="empty">No titles are available in this category.</div>';
          return;
        }
        items.slice(0, 10).forEach(function (item) {
          scroller.appendChild(category.type === 'genres' || category.type === 'options'
            ? createOptionCard(category, item)
            : createCard(item));
        });
      }

      function loadDiscover() {
        var rows = document.getElementById('discoverRows');
        if (rows.children.length) return;
        categories.forEach(function (category) {
          rows.appendChild(createMediaRow(category));
          loadCategory(category).then(function (items) {
            populateMediaRow(category, items);
          }).catch(function (error) {
            populateMediaRow(category, []);
            notice(category.title + ': ' + error.message);
          });
        });
      }

      function showView(name) {
        activeView = name;
        activeCategory = null;
        ['discover', 'category', 'search', 'requests'].forEach(function (view) {
          document.getElementById(view + 'View').hidden = view !== name;
        });
        ['discover', 'movies', 'tv', 'search', 'requests'].forEach(function (view) {
          document.getElementById(view + 'Nav').classList.toggle('active', view === name);
        });
        notice('');
        document.getElementById('topPageTitle').textContent = name === 'requests' ? 'My Requests' : name === 'search' ? 'Search' : 'Discover';
        if (name === 'discover') {
          loadDiscover();
          document.getElementById('app').scrollTop = 0;
          document.getElementById('discoverNav').focus();
        }
        if (name === 'search') document.getElementById('searchInput').focus();
        if (name === 'requests') loadMyRequests();
      }

      function openCategory(key, navName) {
        var category = categoryByKey(key);
        if (!category) return;
        activeView = navName || 'category';
        activeCategory = key;
        ['discover', 'search', 'requests'].forEach(function (view) {
          document.getElementById(view + 'View').hidden = true;
        });
        document.getElementById('categoryView').hidden = false;
        ['discover', 'movies', 'tv', 'search', 'requests'].forEach(function (view) {
          document.getElementById(view + 'Nav').classList.toggle('active', view === navName);
        });
        document.getElementById('categoryTitle').textContent = category.title;
        document.getElementById('topPageTitle').textContent = category.title;
        document.getElementById('categoryCards').innerHTML = '<div class="empty">Loading…</div>';
        document.getElementById('app').scrollTop = 0;
        loadCategory(category).then(function (items) {
          if (category.type === 'genres' || category.type === 'options') {
            var container = document.getElementById('categoryCards');
            container.innerHTML = '';
            items.forEach(function (item) { container.appendChild(createOptionCard(category, item)); });
          } else {
            renderCards('categoryCards', items, 'Nothing is available in this category.');
          }
          document.getElementById('categoryBack').focus();
        }).catch(function (error) { notice(error.message); });
      }

      function openFilteredCategory(title, url) {
        activeView = 'category';
        activeCategory = 'filter';
        ['discover', 'search', 'requests'].forEach(function (view) {
          document.getElementById(view + 'View').hidden = true;
        });
        document.getElementById('categoryView').hidden = false;
        document.getElementById('categoryTitle').textContent = title;
        document.getElementById('topPageTitle').textContent = title;
        document.getElementById('categoryCards').innerHTML = '<div class="empty">Loading…</div>';
        document.getElementById('app').scrollTop = 0;
        api(url + (url.indexOf('?') === -1 ? '?page=1' : '&page=1')).then(function (data) {
          renderCards('categoryCards', data.results || [], 'Nothing is available in this category.');
          document.getElementById('categoryBack').focus();
        }).catch(function (error) { notice(error.message); });
      }

      function runSearch(event) {
        event.preventDefault();
        var query = document.getElementById('searchInput').value.trim();
        if (!query) return;
        notice('Searching…');
        api('/api/v1/search?query=' + encodeURIComponent(query)).then(function (data) {
          var results = data.results.filter(function (item) {
            return item.mediaType === 'movie' || item.mediaType === 'tv';
          });
          renderCards('searchCards', results, 'No movies or shows found.');
          notice('');
          var first = document.querySelector('#searchCards .card');
          if (first) first.focus();
        }).catch(function (error) { notice(error.message); });
      }

      function loadMyRequests() {
        notice('Loading your requests…');
        api('/api/v1/request?filter=all&take=20&sort=modified&skip=0').then(function (data) {
          return Promise.all(data.results.map(function (request) {
            var path = request.type === 'tv' ? '/api/v1/tv/' : '/api/v1/movie/';
            return api(path + request.media.tmdbId).then(function (details) {
              details.mediaType = request.type;
              return details;
            }).catch(function () { return null; });
          }));
        }).then(function (items) {
          renderCards('requestCards', items.filter(function (item) { return item; }), 'You have not made any requests yet.');
          notice('');
        }).catch(function (error) { notice(error.message); });
      }

      function openModal(item) {
        var status = mediaStatus(item);
        selectedItem = item;
        document.getElementById('modalTitle').textContent = itemTitle(item);
        document.getElementById('modalMeta').textContent = (item.mediaType === 'tv' ? 'TV Show' : 'Movie') + (itemYear(item) ? ' · ' + itemYear(item) : '');
        document.getElementById('modalOverview').textContent = item.overview || 'No description is available.';
        document.getElementById('modalRequest').textContent = status.requestable ? (item.mediaType === 'tv' ? 'Request all available seasons' : 'Request movie') : status.text;
        document.getElementById('modalRequest').disabled = !status.requestable;
        modal.style.display = 'flex';
        (status.requestable ? document.getElementById('modalRequest') : document.getElementById('modalClose')).focus();
      }

      function closeModal() {
        modal.style.display = 'none';
        selectedItem = null;
        if (lastFocusedCard && document.body.contains(lastFocusedCard)) lastFocusedCard.focus();
      }

      function submitRequest() {
        if (!selectedItem) return;
        var item = selectedItem;
        var button = document.getElementById('modalRequest');
        var body = { mediaId: item.id, mediaType: item.mediaType };
        if (item.mediaType === 'tv') body.seasons = 'all';
        button.disabled = true;
        button.textContent = 'Requesting…';
        api('/api/v1/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(body)
        }).then(function () {
          closeModal();
          notice(itemTitle(item) + ' was requested successfully.');
          item.mediaInfo = item.mediaInfo || {};
          item.mediaInfo.status = 2;
        }).catch(function (error) {
          button.disabled = false;
          button.textContent = item.mediaType === 'tv' ? 'Request all available seasons' : 'Request movie';
          document.getElementById('modalOverview').textContent = error.message;
        });
      }

      function previewCatalog() {
        var names = [
          'Dune: Part Two', 'Shōgun', 'The Wild Robot', 'Severance', 'Nosferatu',
          'The Last of Us', 'Wicked', 'The Bear', 'A Complete Unknown', 'Andor',
          'Gladiator II', 'The Penguin', 'Flow', 'Silo', 'Conclave', 'Fallout',
          'Anora', 'Slow Horses', 'Furiosa', 'The White Lotus', 'Alien: Romulus',
          'Dark Matter', 'Inside Out 2', 'Hacks', 'The Substance', 'Arcane'
        ];
        var colors = [
          'linear-gradient(145deg,#aa5429,#2b1721)', 'linear-gradient(145deg,#315d75,#111b29)',
          'linear-gradient(145deg,#337c62,#18221b)', 'linear-gradient(145deg,#68518a,#181526)',
          'linear-gradient(145deg,#9b3346,#24131a)', 'linear-gradient(145deg,#586d32,#151d12)'
        ];
        return names.map(function (name, index) {
          return {
            id: index + 1,
            mediaType: index % 3 === 1 ? 'tv' : 'movie',
            title: index % 3 === 1 ? undefined : name,
            name: index % 3 === 1 ? name : undefined,
            releaseDate: index % 3 === 1 ? undefined : String(2026 - index % 4) + '-01-01',
            firstAirDate: index % 3 === 1 ? String(2026 - index % 4) + '-01-01' : undefined,
            overview: 'Preview description for ' + name + '. Jellyseerr remains the source for live title details and request status.',
            previewColor: colors[index % colors.length],
            mediaInfo: index === 2 ? { status: 5 } : index === 5 ? { status: 2 } : undefined
          };
        });
      }

      function previewApi(path, options) {
        var catalog = previewCatalog();
        var idMatch = path.match(/\/api\/v1\/(?:movie|tv)\/(\d+)/);
        var queryMatch;
        if (path.indexOf('/api/v1/discover/genreslider/') === 0) {
          return ['Action', 'Adventure', 'Animation', 'Comedy', 'Crime', 'Documentary', 'Drama', 'Family', 'Fantasy', 'Mystery', 'Science Fiction', 'Thriller']
            .map(function (name, index) { return { id: index + 1, name: name, backdrops: [] }; });
        }
        if (idMatch) return catalog[(Number(idMatch[1]) - 1) % catalog.length];
        if (path.indexOf('/api/v1/media?') === 0) {
          return { results: catalog.slice(0, 12).map(function (item) {
            return { id: item.id, tmdbId: item.id, mediaType: item.mediaType };
          }) };
        }
        if (path.indexOf('/api/v1/request?') === 0) {
          return { results: catalog.slice(3, 13).map(function (item) {
            return { id: item.id, type: item.mediaType, media: { tmdbId: item.id, mediaType: item.mediaType } };
          }) };
        }
        if (path.indexOf('/api/v1/search?') === 0) {
          queryMatch = decodeURIComponent((path.split('query=')[1] || '').replace(/\+/g, ' ')).toLowerCase();
          return { results: catalog.filter(function (item) { return itemTitle(item).toLowerCase().indexOf(queryMatch) !== -1; }) };
        }
        if (path === '/api/v1/request' && options && options.method === 'POST') return { id: 999 };
        return { page: 1, totalPages: 2, totalResults: catalog.length, results: catalog };
      }

      function showRequests() {
        document.getElementById('status').style.display = 'none';
        document.getElementById('topbar').style.display = 'flex';
        app.style.display = 'block';
        loadDiscover();
        document.getElementById('discoverNav').focus();
      }

      function authenticate() {
        retry.style.display = 'none';
        message.textContent = 'Signing in with your Jellyfin profile\u2026';
        if (isPreview) {
          showRequests();
          return;
        }
        if (!params.user || params.user.length > 128 || !params.id || !/^[a-fA-F0-9-]{1,64}$/.test(params.id)) {
          showError('JellyQuest did not provide a valid Jellyfin profile. Return and sign in again.');
          return;
        }

        fetch('/api/v1/auth/me', { credentials: 'same-origin', cache: 'no-store' })
          .then(function (response) {
            return response.ok ? response.json() : null;
          })
          .then(function (currentUser) {
            if (currentUser && String(currentUser.jellyfinUserId).toLowerCase() === params.id.toLowerCase()) {
              showRequests();
              return null;
            }
            return fetch('/api/v1/auth/jellyfin', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify({ username: params.user, password: '', email: params.user })
            }).then(function (response) {
              if (!response.ok) {
                throw new Error('Jellyseerr rejected the Jellyfin profile (' + response.status + ').');
              }
              return response.json();
            }).then(function (signedInUser) {
              if (String(signedInUser.jellyfinUserId).toLowerCase() !== params.id.toLowerCase()) {
                throw new Error('Jellyseerr returned a different Jellyfin profile.');
              }
              showRequests();
            });
          })
          .catch(function (error) {
            showError(error.message || 'Unable to sign in to Jellyseerr.');
          });
      }

      document.getElementById('back').addEventListener('click', backToJellyQuest);
      document.getElementById('discoverNav').addEventListener('click', function () { showView('discover'); });
      document.getElementById('moviesNav').addEventListener('click', function () { openCategory('popular-movies', 'movies'); });
      document.getElementById('tvNav').addEventListener('click', function () { openCategory('popular-tv', 'tv'); });
      document.getElementById('searchNav').addEventListener('click', function () { showView('search'); });
      document.getElementById('requestsNav').addEventListener('click', function () { showView('requests'); });
      document.getElementById('categoryBack').addEventListener('click', function () { showView('discover'); });
      document.getElementById('searchForm').addEventListener('submit', runSearch);
      document.getElementById('globalSearchForm').addEventListener('submit', function (event) {
        event.preventDefault();
        document.getElementById('searchInput').value = document.getElementById('globalSearch').value;
        showView('search');
        runSearch(event);
      });
      document.getElementById('modalClose').addEventListener('click', closeModal);
      document.getElementById('modalRequest').addEventListener('click', submitRequest);
      retry.addEventListener('click', authenticate);
      window.addEventListener('keydown', handleBack, true);
      window.addEventListener('keydown', handleDirectionalKey, true);
      window.addEventListener('tizenhwkey', handleBack, true);
      authenticate();
    })();
  </script>
</body>
