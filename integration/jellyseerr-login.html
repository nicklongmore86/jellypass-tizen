<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="jellyquest-requests-version" content="1.0.1">
  <title>JellyQuest Requests</title>
  <style>
    * { box-sizing: border-box; }
    html, body { background: #0e1013; color: #fff; height: 100%; margin: 0; font-family: Arial, sans-serif; }
    body { overflow: hidden; }
    body { font-size: 16px; }
    button, input { font: inherit; }
    button { color: #fff; }
    body:before { background: radial-gradient(circle at 78% 6%, rgba(32,84,108,.34), transparent 29%), linear-gradient(180deg, #15171b 0, #0e1013 23rem); content: ''; height: 25rem; left: 3.75rem; pointer-events: none; position: fixed; right: 0; top: 0; }
    button:focus, input:focus { border-color: #fff !important; box-shadow: 0 0 0 .16rem #00a4dc, 0 .35rem 1rem rgba(0,0,0,.62); outline: none; }
    header { background: rgba(14,14,16,.96); bottom: 0; box-shadow: .25rem 0 1rem rgba(0,0,0,.35); display: flex; flex-direction: column; left: 0; overflow: hidden; padding: .5rem 0; position: fixed; top: 4.5rem; transition: width .16s ease, box-shadow .16s ease; width: 3.75rem; z-index: 4; }
    header:focus-within, header:hover, header.is-expanded { background: linear-gradient(90deg, rgba(14,14,16,.98) 0, rgba(14,14,16,.94) 72%, rgba(14,14,16,.68) 86%, rgba(14,14,16,0) 100%); box-shadow: .45rem 0 1.6rem rgba(0,0,0,.3); width: 16rem; }
    header > .nav:first-child { margin-top: auto; }
    header > .nav:last-child { margin-bottom: auto; }
    .brand-mark { display: block; height: 1.7rem; margin-right: .7rem; object-fit: contain; width: 1.7rem; }
    .nav { align-items: center; background: transparent; border: 0; border-radius: 0; color: rgba(255,255,255,.78); display: flex; flex: 0 0 3.4rem; font-size: 1.25rem; font-weight: 400; height: 3.4rem; overflow: hidden; padding: 0 .82rem; text-align: left; width: 100%; }
    .nav-icon { color: currentColor; display: block; flex: 0 0 1.35em; height: 1.35em; margin-right: 1em; width: 1.35em; }
    .nav-icon svg { fill: none; height: 100%; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; width: 100%; }
    .nav-label { opacity: 0; overflow: hidden; text-overflow: ellipsis; transition: opacity .1s ease; white-space: nowrap; }
    header:focus-within .nav-label, header:hover .nav-label, header.is-expanded .nav-label { opacity: 1; }
    .nav.active { color: #00a4dc; }
    .nav:focus { background: linear-gradient(90deg, #333 0, rgba(51,51,51,.96) 72%, rgba(51,51,51,.62) 86%, rgba(51,51,51,0) 100%); color: #fff; outline: .14em solid #fff; outline-offset: -.14em; }
    #topbar { align-items: center; background: rgba(20,20,20,.7); box-shadow: 0 .2rem .8rem #000; display: none; height: 4.5rem; left: 0; padding: 0 1.4375rem 0 4.8125rem; position: fixed; right: 0; top: 0; z-index: 5; }
    .requests-header-top { align-items: center; display: flex; height: auto; }
    #topPageTitle, #globalSearchForm { display: none; }
    #globalSearch { background: #20242a; border: .1rem solid #414750; border-radius: .4rem; color: #fff; font-size: 1.15rem; max-width: 38rem; padding: .72rem 1rem; width: 100%; }
    .profile-dot { align-items: center; background: transparent; border: 0; border-radius: 0; display: flex; flex: 0 0 auto; font-size: 1.25rem; font-weight: 500; height: 2.25rem; justify-content: center; margin: 0; padding: 0; width: auto; }
    .profile-dot:focus { filter: drop-shadow(0 0 .22rem #00a4dc); outline: .12rem solid #fff; outline-offset: .22rem; }
    .requests-tabs { align-items: center; color: #ddd; display: flex; font-size: 1.25rem; height: 4.5rem; justify-content: center; left: 50%; margin: 0; position: absolute; top: 0; transform: translateX(-50%); }
    .requests-tab { background: transparent; border: 0; color: #ddd; font-size: 1.25rem; font-weight: 600; height: 3.375rem; margin: 0 1.5rem; padding: 0; }
    .requests-tab.active { border-bottom: .18rem solid #00a4dc; color: #fff; }
    .requests-tab:focus { box-shadow: inset 0 -.18rem #00a4dc; color: #fff; outline: none; }
    #status { align-items: center; display: flex; font-size: 1.4rem; height: 100%; justify-content: center; margin-left: 3.75rem; padding: 2rem; position: relative; text-align: center; }
    #retry { background: #fff; border: .12rem solid #fff; border-radius: .4rem; color: #111; display: none; margin: 1.25rem auto 0; padding: .7rem 1.1rem; }
    #app { display: none; height: 100%; margin-left: 3.75rem; overflow-y: auto; padding: 6.5rem 3rem 2.625rem; position: relative; scroll-behavior: auto; }
    h2 { font-size: 1.85rem; font-weight: 500; margin: 0 0 1.2rem; }
    .search-row { display: flex; margin-bottom: 1.5rem; max-width: 58rem; }
    #searchInput { background: #20242a; border: .12rem solid #414750; border-radius: .4rem 0 0 .4rem; color: #fff; flex: 1; font-size: 1.35rem; min-width: 0; padding: .9rem 1.1rem; }
    #searchButton { background: #fff; border: .12rem solid #fff; border-radius: 0 .4rem .4rem 0; color: #111; font-weight: 700; padding: .8rem 1.4rem; }
    #messageBar { background: #20242a; border: .1rem solid #414750; border-left: .3rem solid #00a4dc; border-radius: .35rem; display: none; margin-bottom: 1.2rem; padding: .8rem 1rem; }
    .media-row { margin-bottom: 1.7rem; }
    .row-header { align-items: flex-start; display: flex; height: 4rem; justify-content: space-between; }
    .row-header h2 { color: #fff; font-size: 1.8rem; font-weight: 500; margin: 0; }
    .see-more { background: transparent; border: .12rem solid transparent; border-radius: .35rem; color: #b9bec5; font-size: 1.1rem; font-weight: 500; padding: .45rem .7rem; }
    .row-scroller { display: flex; gap: 1.15rem; margin: 0; overflow: hidden; padding: .35rem .25rem .55rem; }
    .cards { display: flex; flex-wrap: wrap; margin: 0 -.55rem; }
    .card { background: transparent; border: 0; color: #fff; flex: 0 0 auto; height: 20.5rem; margin: 0 .5rem; overflow: visible; padding: 0; position: relative; text-align: left; width: 14.7rem; }
    .row-scroller .card { margin: 0; width: calc((100% - 6.9rem) / 7); }
    .cards .card { margin: 0 .55rem 1.1rem; }
    .card:focus { box-shadow: none; }
    .poster { background: linear-gradient(145deg, #313844, #15181e); border: .18rem solid transparent; border-radius: .45rem; box-shadow: 0 .45rem 1.2rem rgba(0,0,0,.45); display: block; height: 16rem; object-fit: cover; overflow: hidden; transition: border-color .12s ease, transform .12s ease; width: 100%; }
    .card:focus .poster { border-color: #fff; box-shadow: 0 .65rem 2rem rgba(0,0,0,.8); transform: scale(1.045); }
    .poster-missing { align-items: flex-end; color: #fff; display: flex; font-size: 1.45rem; font-weight: 800; justify-content: flex-start; line-height: 1.05; padding: .9rem; text-align: left; text-transform: uppercase; }
    .card-copy { background: transparent; display: block; min-height: 4rem; padding: .65rem 0 0; }
    .title { display: block; font-size: 1.125rem; font-weight: 400; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card:focus .title { color: #00c7db; }
    .meta { color: #9ca2aa; display: block; font-size: .9375rem; margin-top: .1875rem; }
    .badge { background: #252a31; border: .08rem solid #59616d; border-radius: .25rem; color: #e8e8e8; display: inline-block; font-size: .75rem; font-weight: 700; margin-top: .4rem; padding: .18rem .48rem; text-transform: uppercase; }
    .badge.available { background: #1e4936; border-color: #4b8a68; }
    .badge.pending { background: #59441d; border-color: #9c7a34; }
    .type-badge { background: rgba(0,0,0,.68); border: .08rem solid #626a74; border-radius: .25rem; font-size: .72rem; font-weight: 700; left: .55rem; padding: .22rem .5rem; position: absolute; text-transform: uppercase; top: .55rem; z-index: 1; }
    .type-badge.tv { background: rgba(0,0,0,.68); border-color: #626a74; }
    .option-card { align-items: flex-end; background: linear-gradient(145deg, #294f61, #1a1d24); border: .17rem solid transparent; border-radius: .4rem; box-shadow: 0 .45rem 1.2rem rgba(0,0,0,.4); color: #fff; display: flex; flex: 0 0 auto; font-size: 1.25rem; font-weight: 600; height: 9rem; justify-content: flex-start; margin: 0 .5rem; padding: 1rem; text-align: left; transition: border-color .12s ease, transform .12s ease; width: 15rem; }
    .option-card:nth-child(even) { background: linear-gradient(145deg, #384f6d, #1a1d24); }
    .option-card:focus { border-color: #fff !important; box-shadow: 0 .6rem 1.6rem rgba(0,0,0,.75); transform: scale(1.035); }
    .cards .option-card { margin: 0 .55rem 1.1rem; }
    .empty { color: #bbb; font-size: 1.15rem; padding: 2rem 0; }
    .loading-row { align-items: center; color: #aaa; display: flex; font-size: 1.1rem; height: 21.5rem; padding-left: .5rem; }
    .section-heading { align-items: center; display: flex; height: 5rem; margin: 0; }
    .section-heading h2, #requestsView > h2 { font-size: 2.375rem; font-weight: 600; line-height: 1.35; margin: 0; }
    #categoryCards, #requestCards { padding-top: .75rem; }
    #requestsView > h2 { align-items: center; display: flex; height: 5rem; }
    #searchView > h2 { font-size: 2.375rem; font-weight: 600; line-height: 1.35; margin: 0 0 1rem; }
    #searchButton { font-size: 1.35rem; }
    #modal { align-items: center; background: rgba(0, 0, 0, .82); bottom: 0; display: none; justify-content: center; left: 0; padding: 2rem; position: fixed; right: 0; top: 0; z-index: 5; }
    .dialog { background: #20242a; border: .1rem solid #59616d; border-radius: .45rem; box-shadow: 0 .8rem 2.4rem rgba(0,0,0,.82); max-height: 88%; max-width: 52rem; overflow-y: auto; padding: 1.75rem; width: 100%; }
    .dialog h2 { margin-bottom: .7rem; }
    .dialog p { color: #d0d3d7; font-size: 1.2rem; line-height: 1.45; }
    .season-options { display: flex; flex-wrap: wrap; gap: .9rem; margin-top: 1.25rem; }
    .season-options[hidden] { display: none; }
    .season-toggle { background: #343a43; border: .12rem solid #565d68; border-radius: .4rem; min-width: 4.5rem; padding: .65rem .85rem; }
    .season-toggle[aria-pressed="true"] { background: #fff; border-color: #fff; color: #111; font-weight: 700; }
    .dialog-actions { margin-top: 1.25rem; text-align: right; }
    .dialog-actions button { background: #343a43; border: .12rem solid #565d68; border-radius: .4rem; margin-left: .9rem; padding: .7rem 1rem; }
    .dialog-actions .primary { background: #fff; border-color: #fff; color: #111; font-weight: 700; }
    .dialog-actions button:disabled { background: #333; color: #888; }
  </style>
</head>
<body>
  <header aria-label="Requests navigation">
    <button class="nav active" id="discoverNav" type="button"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6z"></path></svg></span><span class="nav-label">Discover</span></button>
    <button class="nav" id="moviesNav" type="button"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="1"></rect><path d="M3 9h18M7 5l3 4m3-4 3 4"></path></svg></span><span class="nav-label">Movies</span></button>
    <button class="nav" id="tvNav" type="button"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="15" height="13" rx="1"></rect><path d="M6 8H3v12h15v-2m-6-9 4 2.5-4 2.5z"></path></svg></span><span class="nav-label">TV Shows</span></button>
    <button class="nav" id="searchNav" type="button"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg></span><span class="nav-label">Search</span></button>
    <button class="nav" id="requestsNav" type="button"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg></span><span class="nav-label">My Requests</span></button>
  </header>
  <div id="topbar">
    <div class="requests-header-top">
      <button class="profile-dot" id="requestsProfile" type="button" aria-label="Return to Jellyfin profile"><img class="brand-mark" src="../icon.png" alt=""><span id="requestsProfileName">Living Room</span></button>
      <div id="topPageTitle">Discover</div>
      <form id="globalSearchForm"><input id="globalSearch" type="search" maxlength="100" placeholder="Search movies and TV shows…" autocomplete="off"></form>
    </div>
    <div class="requests-tabs"><button class="requests-tab" id="requestsHomeTab" type="button">Home</button><button class="requests-tab active" id="requestsTopTab" type="button">Requests</button></div>
  </div>
  <main id="status">
    <div>
      <div id="message">Signing in with your Jellyfin profile&hellip;</div>
      <button id="retry" type="button">Try again</button>
    </div>
  </main>
  <main id="app">
    <div id="messageBar"></div>
    <section id="discoverView">
      <div id="discoverRows"></div>
    </section>
    <section id="categoryView" hidden>
      <div class="section-heading">
        <h2 id="categoryTitle"></h2>
      </div>
      <div class="cards" id="categoryCards"></div>
    </section>
    <section id="searchView" hidden>
      <h2>Search for something to request</h2>
      <form class="search-row" id="searchForm">
        <input id="searchInput" type="search" maxlength="100" placeholder="Movie or TV show" autocomplete="off">
        <button id="searchButton" type="submit">Search</button>
      </form>
      <div class="cards" id="searchCards"></div>
    </section>
    <section id="requestsView" hidden>
      <h2>My Requests</h2>
      <div class="cards" id="requestCards"></div>
    </section>
  </main>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="dialog">
      <h2 id="modalTitle"></h2>
      <div class="meta" id="modalMeta"></div>
      <p id="modalOverview"></p>
      <div class="season-options" id="seasonOptions" aria-label="Seasons to request" hidden></div>
      <div class="dialog-actions">
        <button id="modalClose" type="button">Cancel</button>
        <button class="primary" id="modalRequest" type="button">Request</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      'use strict';

      var message = document.getElementById('message');
      var retry = document.getElementById('retry');
      var app = document.getElementById('app');
      var modal = document.getElementById('modal');
      var selectedItem = null;
      var selectedSeasons = [];
      var selectedAccess = null;
      var selectedAction = 'request';
      var lastFocusedCard = null;
      var activeView = 'discover';
      var activeCategory = null;
      var categoryCache = {};
      var ownRequestKeys = {};
      var profileClaims = {};
      var bridgeFrame = null;
      var bridgeOrigin = '';
      var bridgeNonce = '';
      var bridgeReadyPromise = null;
      var bridgeRequestId = 0;
      var bridgeRequests = {};
      var bridgeQueue = [];
      var bridgeActiveRequests = 0;
      var bridgeConcurrency = 4;
      var isPreview = /(?:\?|&)preview=1(?:&|$)/.test(window.location.search);
      var params = {};
      var categories = [
        { key: 'recently-added', title: 'Recently Added', type: 'recentlyAdded' },
        { key: 'recent-requests', title: 'Recent Requests', type: 'recentRequests' },
        { key: 'trending', title: 'Trending', url: '/api/v1/discover/trending' },
        { key: 'popular-movies', title: 'Popular Movies', url: '/api/v1/discover/movies' },
        { key: 'movie-genres', title: 'Movie Genres', type: 'genres', mediaType: 'movie', url: '/api/v1/discover/genreslider/movie' },
        { key: 'upcoming-movies', title: 'Upcoming Movies', url: '/api/v1/discover/movies/upcoming' },
        { key: 'studios', title: 'Studios', type: 'options', mediaType: 'movie', items: [
          { id: 2, name: 'Disney' }, { id: 127928, name: '20th Century Studios' },
          { id: 34, name: 'Sony Pictures' }, { id: 174, name: 'Warner Bros.' },
          { id: 33, name: 'Universal' }, { id: 4, name: 'Paramount' },
          { id: 3, name: 'Pixar' }, { id: 521, name: 'DreamWorks' },
          { id: 420, name: 'Marvel Studios' }, { id: 41077, name: 'A24' }
        ] },
        { key: 'popular-tv', title: 'Popular TV Shows', url: '/api/v1/discover/tv' },
        { key: 'tv-genres', title: 'TV Genres', type: 'genres', mediaType: 'tv', url: '/api/v1/discover/genreslider/tv' },
        { key: 'upcoming-tv', title: 'Upcoming TV Shows', url: '/api/v1/discover/tv/upcoming' },
        { key: 'networks', title: 'Networks', type: 'options', mediaType: 'tv', items: [
          { id: 213, name: 'Netflix' }, { id: 2739, name: 'Disney+' },
          { id: 1024, name: 'Prime Video' }, { id: 2552, name: 'Apple TV+' },
          { id: 453, name: 'Hulu' }, { id: 49, name: 'HBO' },
          { id: 4353, name: 'Peacock' }, { id: 2, name: 'ABC' },
          { id: 19, name: 'FOX' }, { id: 174, name: 'AMC' }
        ] }
      ];

      window.location.hash.slice(1).split('&').forEach(function (part) {
        var separator = part.indexOf('=');
        if (separator > 0) {
          params[decodeURIComponent(part.slice(0, separator))] = decodeURIComponent(part.slice(separator + 1));
        }
      });
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
      document.getElementById('requestsProfileName').textContent = params.user || 'Living Room';

      function validBridgeUrl(url) {
        try {
          var parsed = new URL(url);
          return parsed.protocol === 'https:'
            && parsed.origin === 'https://jelly-farmhouse.starrgroup.io'
            && parsed.pathname === '/jellyquest-bridge/bridge.html';
        } catch (error) {
          return false;
        }
      }

      function randomNonce() {
        var values = new Uint32Array(4);
        window.crypto.getRandomValues(values);
        return Array.prototype.map.call(values, function (value) { return value.toString(16); }).join('');
      }

      function handleBridgeMessage(event) {
        var data = event.data || {};
        if (!bridgeFrame || event.source !== bridgeFrame.contentWindow || event.origin !== bridgeOrigin
            || data.source !== 'jellyquest-bridge' || data.nonce !== bridgeNonce) return;
        if (data.type === 'ready' && bridgeReadyPromise && bridgeReadyPromise.resolve) {
          window.clearTimeout(bridgeReadyPromise.timer);
          bridgeReadyPromise.resolve();
          bridgeReadyPromise.resolve = null;
          return;
        }
        if (data.type === 'error' && bridgeReadyPromise && bridgeReadyPromise.reject) {
          window.clearTimeout(bridgeReadyPromise.timer);
          var reject = bridgeReadyPromise.reject;
          bridgeReadyPromise = null;
          if (bridgeFrame && bridgeFrame.parentNode) bridgeFrame.parentNode.removeChild(bridgeFrame);
          bridgeFrame = null;
          reject(new Error(data.error || 'Request bridge authentication failed.'));
          return;
        }
        if (data.type !== 'response' || !bridgeRequests[data.id]) return;
        var pending = bridgeRequests[data.id];
        delete bridgeRequests[data.id];
        window.clearTimeout(pending.timer);
        if (data.ok) pending.resolve(data.data);
        else pending.reject(new Error(data.error || 'Jellyseerr request failed.'));
      }

      function startBridge() {
        if (isPreview) return Promise.resolve();
        if (bridgeReadyPromise) return bridgeReadyPromise.promise;
        if (!validBridgeUrl(params.bridge)) return Promise.reject(new Error('JellyQuest request bridge is not configured.'));
        var bridgeUrl = new URL(params.bridge);
        bridgeOrigin = bridgeUrl.origin;
        bridgeNonce = randomNonce();
        bridgeUrl.hash = 'user=' + encodeURIComponent(params.user || '')
          + '&id=' + encodeURIComponent(params.id || '')
          + '&nonce=' + encodeURIComponent(bridgeNonce);
        var holder = {};
        holder.promise = new Promise(function (resolve, reject) {
          holder.resolve = resolve;
          holder.reject = reject;
          holder.timer = window.setTimeout(function () {
            bridgeReadyPromise = null;
            if (bridgeFrame && bridgeFrame.parentNode) bridgeFrame.parentNode.removeChild(bridgeFrame);
            bridgeFrame = null;
            holder.reject(new Error('JellyQuest could not reach the request bridge.'));
          }, 15000);
        });
        bridgeReadyPromise = holder;
        bridgeFrame = document.createElement('iframe');
        bridgeFrame.hidden = true;
        bridgeFrame.setAttribute('aria-hidden', 'true');
        bridgeFrame.src = bridgeUrl.href;
        document.body.appendChild(bridgeFrame);
        return holder.promise;
      }

      function executeBridgeApi(path, options) {
        return startBridge().then(function () {
          return new Promise(function (resolve, reject) {
            bridgeRequestId += 1;
            var id = String(bridgeRequestId);
            var timer = window.setTimeout(function () {
              delete bridgeRequests[id];
              reject(new Error('Jellyseerr request timed out.'));
            }, 20000);
            bridgeRequests[id] = { resolve: resolve, reject: reject, timer: timer };
            bridgeFrame.contentWindow.postMessage({
              source: 'jellyquest-app',
              type: 'request',
              nonce: bridgeNonce,
              id: id,
              path: path,
              options: options || {}
            }, bridgeOrigin);
          });
        });
      }

      function drainBridgeQueue() {
        while (bridgeActiveRequests < bridgeConcurrency && bridgeQueue.length) {
          (function (task) {
            bridgeActiveRequests += 1;
            executeBridgeApi(task.path, task.options).then(task.resolve, task.reject).then(function () {
              bridgeActiveRequests -= 1;
              drainBridgeQueue();
            });
          })(bridgeQueue.shift());
        }
      }

      function bridgeApi(path, options, priority) {
        return new Promise(function (resolve, reject) {
          var task = { path: path, options: options, resolve: resolve, reject: reject };
          if (priority) bridgeQueue.unshift(task);
          else bridgeQueue.push(task);
          drainBridgeQueue();
        });
      }

      function isSafeReturnUrl(url) {
        return typeof url === 'string' && (
          /^file:\/\/\//.test(url) ||
          /^https:\/\/jelly-farmhouse\.starrgroup\.io(?:\/|$)/.test(url)
        );
      }

      function backToJellyQuest(event) {
        if (event) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
        if (isSafeReturnUrl(params.return)) {
          window.location.replace(params.return);
        } else if (isPreview) {
          window.location.href = 'jellyfin-profile-preview.html';
        } else {
          window.history.back();
        }
      }

      function returnToJellyfinHome() {
        if (isPreview) {
          window.location.href = 'jellyfin-profile-preview.html';
          return;
        }
        if (!isSafeReturnUrl(params.return)) {
          backToJellyQuest();
          return;
        }
        try {
          var target = new URL(params.return);
          target.hash = '/home.html';
          window.location.replace(target.href);
        } catch (error) {
          backToJellyQuest();
        }
      }

      function handleBack(event) {
        var isBack = event.type === 'tizenhwkey'
          ? event.keyName === 'back'
          : event.keyCode === 10009 || event.keyCode === 8;
        if (isBack) {
          if (modal.style.display === 'flex') {
            event.preventDefault();
            event.stopImmediatePropagation();
            closeModal();
          } else if (activeCategory || activeView !== 'discover') {
            event.preventDefault();
            event.stopImmediatePropagation();
            showView('discover');
          } else {
            backToJellyQuest(event);
          }
        }
      }

      function isVisible(element) {
        return element.offsetWidth > 0 && element.offsetHeight > 0 && !element.disabled;
      }

      function focusableElements() {
        var root = modal.style.display === 'flex' ? modal : document.body;
        return Array.prototype.slice.call(root.querySelectorAll('button:not([disabled]), input:not([disabled])'))
          .filter(isVisible);
      }

      function focusFrom(current, target, direction) {
        var opposite = { left: 'right', right: 'left', up: 'down', down: 'up' }[direction];
        if (!target) return;
        target._jellyquestReturnFocus = target._jellyquestReturnFocus || {};
        target._jellyquestReturnFocus[opposite] = current;
        target.focus();
        try {
          target.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        } catch (error) {
          target.scrollIntoView(false);
        }
      }

      function nearestByAxis(current, candidates, axis) {
        var rect = current.getBoundingClientRect();
        var origin = axis === 'x' ? rect.left + rect.width / 2 : rect.top + rect.height / 2;
        candidates.sort(function (left, right) {
          var leftRect = left.getBoundingClientRect();
          var rightRect = right.getBoundingClientRect();
          var leftPoint = axis === 'x' ? leftRect.left + leftRect.width / 2 : leftRect.top + leftRect.height / 2;
          var rightPoint = axis === 'x' ? rightRect.left + rightRect.width / 2 : rightRect.top + rightRect.height / 2;
          return Math.abs(leftPoint - origin) - Math.abs(rightPoint - origin);
        });
        return candidates[0] || null;
      }

      function workspaceEntryTarget() {
        if (activeView === 'search') return document.getElementById('searchInput');
        if (activeView === 'requests') return document.querySelector('#requestCards .card');
        if (activeCategory) {
          return document.querySelector('#categoryCards .card, #categoryCards .option-card');
        }
        return document.querySelector('#discoverView .card, #discoverView .option-card');
      }

      function completeMove(event, current, target, direction) {
        event.preventDefault();
        event.stopImmediatePropagation();
        focusFrom(current, target, direction);
      }

      function visibleCards(root) {
        return Array.prototype.slice.call(root.querySelectorAll('.card, .option-card')).filter(isVisible);
      }

      function navigableDiscoverRows() {
        return Array.prototype.slice.call(document.querySelectorAll('#discoverRows .media-row'))
          .filter(isVisible)
          .filter(function (row) { return visibleCards(row).length > 0; });
      }

      function visualRows(cards) {
        var rows = [];
        cards.slice().sort(function (left, right) {
          var leftRect = left.getBoundingClientRect();
          var rightRect = right.getBoundingClientRect();
          return Math.abs(leftRect.top - rightRect.top) < 12 ? leftRect.left - rightRect.left : leftRect.top - rightRect.top;
        }).forEach(function (card) {
          var rect = card.getBoundingClientRect();
          var centerY = rect.top + rect.height / 2;
          var row = rows.filter(function (candidate) { return Math.abs(candidate.y - centerY) < 20; })[0];
          if (!row) {
            row = { y: centerY, cards: [] };
            rows.push(row);
          }
          row.cards.push(card);
          row.cards.sort(function (left, right) { return left.getBoundingClientRect().left - right.getBoundingClientRect().left; });
        });
        return rows.sort(function (left, right) { return left.y - right.y; });
      }

      function gridTarget(current, direction, cards, topTargets, leftTarget) {
        var rows = visualRows(cards);
        var rowIndex = -1;
        var column = -1;
        rows.some(function (row, index) {
          var found = row.cards.indexOf(current);
          if (found === -1) return false;
          rowIndex = index;
          column = found;
          return true;
        });
        if (rowIndex === -1) return null;
        if (direction === 'left') return column > 0 ? rows[rowIndex].cards[column - 1] : leftTarget;
        if (direction === 'right') return column < rows[rowIndex].cards.length - 1 ? rows[rowIndex].cards[column + 1] : null;
        if (direction === 'up') {
          return rowIndex > 0
            ? rows[rowIndex - 1].cards[Math.min(column, rows[rowIndex - 1].cards.length - 1)]
            : nearestByAxis(current, topTargets.filter(Boolean), 'x');
        }
        if (direction === 'down' && rowIndex < rows.length - 1) {
          return rows[rowIndex + 1].cards[Math.min(column, rows[rowIndex + 1].cards.length - 1)];
        }
        return null;
      }

      function moveFocus(direction, event) {
        var elements = focusableElements();
        var current = document.activeElement;

        if (!elements.length) return;
        if (elements.indexOf(current) === -1) {
          elements[0].focus();
          event.preventDefault();
          return;
        }
        var remembered = current._jellyquestReturnFocus && current._jellyquestReturnFocus[direction];
        var forceProfileToRail = current.id === 'requestsProfile' && direction === 'down';
        if (!forceProfileToRail && remembered && document.body.contains(remembered) && isVisible(remembered)) {
          completeMove(event, current, remembered, direction);
          return;
        }

        var railElements = elements.filter(function (element) { return element.classList.contains('nav'); });
        var headerElements = elements.filter(function (element) {
          return element.id === 'requestsProfile'
            || element.id === 'requestsHomeTab'
            || element.id === 'requestsTopTab';
        });
        var workspaceElements = elements.filter(function (element) { return app.contains(element); });
        var railIndex = railElements.indexOf(current);
        var headerIndex = headerElements.indexOf(current);
        var activeRail = document.querySelector('.nav.active') || document.getElementById('discoverNav');
        var target = null;

        if (modal.style.display === 'flex') {
          var seasonButtons = elements.filter(function (element) { return element.classList.contains('season-toggle'); });
          var actionButtons = elements.filter(function (element) { return element.closest('.dialog-actions'); });
          var seasonIndex = seasonButtons.indexOf(current);
          var actionIndex = actionButtons.indexOf(current);
          if (seasonIndex !== -1) {
            if (direction === 'left' && seasonIndex > 0) target = seasonButtons[seasonIndex - 1];
            if (direction === 'right' && seasonIndex < seasonButtons.length - 1) target = seasonButtons[seasonIndex + 1];
            if (direction === 'down') target = nearestByAxis(current, actionButtons.slice(), 'x');
          } else if (actionIndex !== -1) {
            if (direction === 'left' && actionIndex > 0) target = actionButtons[actionIndex - 1];
            if (direction === 'right' && actionIndex < actionButtons.length - 1) target = actionButtons[actionIndex + 1];
            if (direction === 'up' && seasonButtons.length) target = nearestByAxis(current, seasonButtons.slice(), 'x');
          }
          completeMove(event, current, target, direction);
          return;
        }

        if (railIndex !== -1) {
          if (direction === 'up') target = railIndex > 0 ? railElements[railIndex - 1] : document.getElementById('requestsProfile');
          if (direction === 'down' && railIndex < railElements.length - 1) target = railElements[railIndex + 1];
          if (direction === 'right') target = workspaceEntryTarget() || document.getElementById('requestsTopTab');
          completeMove(event, current, target, direction);
          return;
        }

        if (headerIndex !== -1) {
          if (direction === 'left' && headerIndex > 0) target = headerElements[headerIndex - 1];
          if (direction === 'right' && headerIndex < headerElements.length - 1) target = headerElements[headerIndex + 1];
          if (direction === 'down') target = current.id === 'requestsProfile'
            ? activeRail
            : nearestByAxis(current, [workspaceEntryTarget()].filter(Boolean), 'x');
          completeMove(event, current, target, direction);
          return;
        }

        if (current.id === 'searchInput' && direction === 'right') {
          completeMove(event, current, document.getElementById('searchButton'), direction);
          return;
        }
        if (current.id === 'searchButton' && direction === 'left') {
          completeMove(event, current, document.getElementById('searchInput'), direction);
          return;
        }
        if ((current.id === 'searchInput' || current.id === 'searchButton') && direction === 'up') {
          completeMove(event, current, document.getElementById('requestsTopTab'), direction);
          return;
        }

        var mediaRow = current.closest ? current.closest('.media-row') : null;
        if (mediaRow && (current.classList.contains('card') || current.classList.contains('option-card'))) {
          var discoverRows = navigableDiscoverRows();
          var discoverRowIndex = discoverRows.indexOf(mediaRow);
          var rowCards = visibleCards(mediaRow);
          var cardIndex = rowCards.indexOf(current);
          if (direction === 'left') target = cardIndex > 0 ? rowCards[cardIndex - 1] : activeRail;
          if (direction === 'right') target = cardIndex < rowCards.length - 1 ? rowCards[cardIndex + 1] : mediaRow.querySelector('.see-more');
          if (direction === 'up') {
            target = discoverRowIndex > 0
              ? visibleCards(discoverRows[discoverRowIndex - 1])[Math.min(cardIndex, visibleCards(discoverRows[discoverRowIndex - 1]).length - 1)]
              : nearestByAxis(current, headerElements.slice(1), 'x');
          }
          if (direction === 'down' && discoverRowIndex < discoverRows.length - 1) {
            var nextCards = visibleCards(discoverRows[discoverRowIndex + 1]);
            target = nextCards[Math.min(cardIndex, nextCards.length - 1)];
          }
          completeMove(event, current, target, direction);
          return;
        }

        if (current.classList.contains('see-more') && mediaRow) {
          var rows = navigableDiscoverRows();
          var rowIndex = rows.indexOf(mediaRow);
          if (direction === 'left') target = visibleCards(mediaRow).slice(-1)[0];
          if (direction === 'up') target = rowIndex > 0 ? rows[rowIndex - 1].querySelector('.see-more') : nearestByAxis(current, headerElements.slice(1), 'x');
          if (direction === 'down' && rowIndex < rows.length - 1) target = rows[rowIndex + 1].querySelector('.see-more');
          completeMove(event, current, target, direction);
          return;
        }

        if (current.classList.contains('card') || current.classList.contains('option-card')) {
          var container = current.closest('.cards');
          var topTargets = activeCategory
            ? headerElements.slice(1)
            : activeView === 'search'
              ? [document.getElementById('searchInput'), document.getElementById('searchButton')]
              : headerElements.slice(1);
          target = gridTarget(current, direction, visibleCards(container), topTargets, activeRail);
          completeMove(event, current, target, direction);
          return;
        }

        completeMove(event, current, null, direction);
      }

      function handleDirectionalKey(event) {
        var directions = { 37: 'left', 38: 'up', 39: 'right', 40: 'down' };
        if (directions[event.keyCode]) moveFocus(directions[event.keyCode], event);
      }

      function showError(text) {
        message.textContent = text;
        retry.style.display = 'block';
        retry.focus();
      }

      function api(path, options) {
        if (isPreview) return Promise.resolve(previewApi(path, options));
        return bridgeApi(path, options, path.indexOf('/jellyquest/access') === 0);
      }

      function notice(text) {
        var bar = document.getElementById('messageBar');
        bar.textContent = text;
        bar.style.display = text ? 'block' : 'none';
      }

      function itemTitle(item) {
        return item.title || item.name || 'Untitled';
      }

      function itemYear(item) {
        var date = item.releaseDate || item.firstAirDate || '';
        return date ? date.slice(0, 4) : '';
      }

      function mediaStatus(item) {
        if (item.jellyquestClaimState === 'owned') return { text: 'In My Library', css: 'available', requestable: false };
        if (item.jellyquestClaimState === 'claimed') return { text: 'Added when ready', css: 'pending', requestable: false };
        var status = item.mediaInfo && item.mediaInfo.status;
        var ownRequest = ownRequestKeys[item.mediaType + ':' + itemTmdbId(item)];
        if (status === 5) return { text: 'Available', css: 'available', requestable: false };
        if (status === 2) return { text: ownRequest ? 'Requested by you' : 'Requested by another profile', css: 'pending', requestable: false };
        if (status === 3) return { text: ownRequest ? 'Processing for you' : 'Requested by another profile', css: 'pending', requestable: false };
        if (status === 4) return { text: 'Partially available', css: 'pending', requestable: true };
        if (status === 6) return { text: 'Unavailable', css: '', requestable: false };
        return { text: 'Request', css: '', requestable: true };
      }

      function itemTmdbId(item) {
        return Number(item.tmdbId || item.id);
      }

      function isSelectedItem(item) {
        return selectedItem && selectedItem.mediaType === item.mediaType
          && itemTmdbId(selectedItem) === itemTmdbId(item);
      }

      function loadMediaAccess(item) {
        return api('/jellyquest/access?mediaType=' + encodeURIComponent(item.mediaType)
          + '&tmdbId=' + encodeURIComponent(itemTmdbId(item)));
      }

      function rememberProfileClaims(claims) {
        (claims || []).forEach(function (claim) {
          profileClaims[claim.mediaType + ':' + claim.tmdbId] = claim;
        });
      }

      function applyKnownClaim(item) {
        var claim = profileClaims[item.mediaType + ':' + itemTmdbId(item)];
        if (claim) item.jellyquestClaimState = claim.jellyfinItemId ? 'owned' : 'claimed';
      }

      function setModalAction(action, label, disabled) {
        var button = document.getElementById('modalRequest');
        selectedAction = action;
        button.textContent = label;
        button.disabled = Boolean(disabled);
      }

      function applyPersonalizedAction(item, status, access) {
        var availableToUser = access.owned || access.public;
        selectedAccess = access;
        if (availableToUser && access.jellyfinItemId) {
          document.getElementById('seasonOptions').hidden = true;
          setModalAction('watch', access.owned ? 'Watch · In My Library' : 'Watch', false);
          return;
        }
        if (access.jellyfinItemId && access.managed) {
          document.getElementById('seasonOptions').hidden = true;
          setModalAction('claim', access.claimed ? 'Adding to My Library…' : 'Add to My Library', access.claimed);
          return;
        }
        if (access.claimed) {
          document.getElementById('seasonOptions').hidden = true;
          setModalAction('claimed', 'Added when ready', true);
          return;
        }
        if (item.mediaInfo && (item.mediaInfo.status === 2 || item.mediaInfo.status === 3)) {
          document.getElementById('seasonOptions').hidden = true;
          setModalAction('claim', 'Add when ready', false);
          return;
        }
        if (!status.requestable) {
          document.getElementById('seasonOptions').hidden = true;
          setModalAction('unavailable', status.text === 'Available' ? 'Waiting for Jellyfin' : status.text, true);
          return;
        }
        selectedAction = 'request';
        if (item.mediaType === 'movie') setModalAction('request', 'Request movie', false);
        renderSeasonOptions(item, status);
      }

      function openJellyfinItem(item, access) {
        if (isPreview) {
          window.location.href = item.mediaType === 'tv' ? 'jellyfin-show-detail-preview.html' : 'jellyfin-movie-detail-preview.html';
          return;
        }
        if (!access || !access.jellyfinItemId || !isSafeReturnUrl(params.return)) return;
        var target = new URL(params.return);
        target.hash = '/details?id=' + encodeURIComponent(access.jellyfinItemId);
        window.location.replace(target.href);
      }

      function createCard(item) {
        var button = document.createElement('button');
        var poster;
        var typeBadge = document.createElement('span');
        var copy = document.createElement('span');
        var title = document.createElement('span');
        var meta = document.createElement('span');
        var badge = document.createElement('span');
        applyKnownClaim(item);
        var status = mediaStatus(item);
        button.type = 'button';
        button.className = 'card';
        typeBadge.className = 'type-badge ' + (item.mediaType === 'tv' ? 'tv' : 'movie');
        typeBadge.textContent = item.mediaType === 'tv' ? 'TV' : 'Movie';
        if (item.posterPath) {
          poster = document.createElement('img');
          poster.className = 'poster';
          poster.alt = '';
          poster.src = 'https://image.tmdb.org/t/p/w342' + item.posterPath;
        } else {
          poster = document.createElement('span');
          poster.className = 'poster poster-missing';
          poster.textContent = 'No artwork';
          if (item.previewColor) {
            poster.style.background = item.previewColor;
            poster.textContent = itemTitle(item);
          }
        }
        copy.className = 'card-copy';
        title.className = 'title';
        title.textContent = itemTitle(item);
        meta.className = 'meta';
        meta.textContent = (item.mediaType === 'tv' ? 'TV' : 'Movie') + (itemYear(item) ? ' · ' + itemYear(item) : '');
        badge.className = 'badge ' + status.css;
        badge.textContent = status.text;
        copy.appendChild(title);
        copy.appendChild(meta);
        copy.appendChild(badge);
        button.appendChild(poster);
        button.appendChild(typeBadge);
        button.appendChild(copy);
        button.addEventListener('click', function () {
          lastFocusedCard = button;
          openModal(item);
        });
        return button;
      }

      function createOptionCard(category, item) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'option-card';
        button.textContent = item.name;
        button.addEventListener('click', function () {
          var base;
          if (category.type === 'genres') {
            base = category.mediaType === 'tv' ? '/api/v1/discover/tv?genre=' : '/api/v1/discover/movies?genre=';
          } else {
            base = category.mediaType === 'tv' ? '/api/v1/discover/tv/network/' : '/api/v1/discover/movies/studio/';
          }
          openFilteredCategory(item.name, base + item.id);
        });
        return button;
      }

      function renderCards(containerId, items, emptyText) {
        var container = document.getElementById(containerId);
        container.innerHTML = '';
        if (!items.length) {
          var empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = emptyText;
          container.appendChild(empty);
          return;
        }
        items.forEach(function (item) { container.appendChild(createCard(item)); });
      }

      function categoryByKey(key) {
        return categories.filter(function (category) { return category.key === key; })[0];
      }

      function detailItems(items) {
        return Promise.all(items.map(function (item) {
          var media = item.media || item;
          var type = item.type || media.mediaType;
          var tmdbId = media.tmdbId || item.id;
          var path = type === 'tv' ? '/api/v1/tv/' : '/api/v1/movie/';
          return api(path + tmdbId).then(function (details) {
            details.mediaType = type;
            return details;
          }).catch(function () { return null; });
        })).then(function (details) {
          return details.filter(function (item) { return item; });
        });
      }

      function genreItems(value) {
        if (Array.isArray(value)) return value;
        var serialized = value && typeof value.error === 'string'
          ? value.error
          : value && typeof value.message === 'string' ? value.message : '';
        var recovered;
        try {
          recovered = JSON.parse(serialized);
        } catch (parseError) {
          throw value instanceof Error ? value : new Error('Jellyseerr did not return genre data.');
        }
        if (!Array.isArray(recovered)) {
          throw value instanceof Error ? value : new Error('Jellyseerr did not return genre data.');
        }
        return recovered;
      }

      function loadCategory(category) {
        if (categoryCache[category.key]) return Promise.resolve(categoryCache[category.key]);
        var request;
        if (category.type === 'recentlyAdded') {
          request = api('/api/v1/media?filter=allavailable&take=20&sort=mediaAdded')
            .then(function (data) { return detailItems(data.results); });
        } else if (category.type === 'recentRequests') {
          request = api('/api/v1/request?filter=all&take=20&sort=modified&skip=0')
            .then(function (data) { return detailItems(data.results); });
        } else if (category.type === 'genres') {
          request = api(category.url).then(genreItems, genreItems);
        } else if (category.type === 'options') {
          request = Promise.resolve(category.items);
        } else {
          request = api(category.url + '?page=1').then(function (data) {
            return data.results.filter(function (item) {
              return item.mediaType === 'movie' || item.mediaType === 'tv';
            });
          });
        }
        return request.then(function (items) {
          categoryCache[category.key] = items;
          return items;
        });
      }

      function createMediaRow(category) {
        var row = document.createElement('section');
        var header = document.createElement('div');
        var title = document.createElement('h2');
        var more = document.createElement('button');
        var scroller = document.createElement('div');
        row.className = 'media-row';
        row.setAttribute('data-category', category.key);
        header.className = 'row-header';
        title.textContent = category.title;
        more.type = 'button';
        more.className = 'see-more';
        more.textContent = 'See More  →';
        more.addEventListener('click', function () { openCategory(category.key); });
        scroller.className = 'row-scroller';
        scroller.innerHTML = '<div class="loading-row">Loading…</div>';
        header.appendChild(title);
        header.appendChild(more);
        row.appendChild(header);
        row.appendChild(scroller);
        return row;
      }

      function populateMediaRow(category, items) {
        var scroller = document.querySelector('[data-category="' + category.key + '"] .row-scroller');
        if (!scroller) return;
        scroller.innerHTML = '';
        if (!items.length) {
          scroller.innerHTML = '<div class="empty">No titles are available in this category.</div>';
          return;
        }
        items.slice(0, 7).forEach(function (item) {
          scroller.appendChild(category.type === 'genres' || category.type === 'options'
            ? createOptionCard(category, item)
            : createCard(item));
        });
        if (category.key === categories[0].key && activeView === 'discover'
            && (document.activeElement === document.body || document.activeElement === document.getElementById('discoverNav'))) {
          var firstCard = scroller.querySelector('.card, .option-card');
          if (firstCard) firstCard.focus();
        }
      }

      function loadDiscover() {
        var rows = document.getElementById('discoverRows');
        if (rows.children.length) return Promise.resolve();
        var firstRowReady = Promise.resolve();
        categories.forEach(function (category, index) {
          rows.appendChild(createMediaRow(category));
          var rowReady = loadCategory(category).then(function (items) {
            populateMediaRow(category, items);
          }).catch(function (error) {
            populateMediaRow(category, []);
            notice(category.title + ': ' + error.message);
          });
          if (index === 0) firstRowReady = rowReady;
        });
        return firstRowReady;
      }

      function focusInitialDiscoverCard() {
        if (activeView !== 'discover') return;
        var firstCard = document.querySelector('[data-category="recently-added"] .card, [data-category="recently-added"] .option-card');
        if (firstCard) firstCard.focus();
      }

      function showView(name) {
        if (activeView === 'search' && name !== 'search') resetSearch();
        activeView = name;
        activeCategory = null;
        ['discover', 'category', 'search', 'requests'].forEach(function (view) {
          document.getElementById(view + 'View').hidden = view !== name;
        });
        ['discover', 'movies', 'tv', 'search', 'requests'].forEach(function (view) {
          document.getElementById(view + 'Nav').classList.toggle('active', view === name);
        });
        notice('');
        document.getElementById('topPageTitle').textContent = name === 'requests' ? 'My Requests' : name === 'search' ? 'Search' : 'Discover';
        if (name === 'discover') {
          document.getElementById('app').scrollTop = 0;
          loadDiscover().then(focusInitialDiscoverCard);
        }
        if (name === 'search') document.getElementById('searchInput').focus();
        if (name === 'requests') loadMyRequests();
      }

      function openCategory(key, navName) {
        var category = categoryByKey(key);
        if (!category) return;
        if (activeView === 'search') resetSearch();
        activeView = navName || 'category';
        activeCategory = key;
        ['discover', 'search', 'requests'].forEach(function (view) {
          document.getElementById(view + 'View').hidden = true;
        });
        document.getElementById('categoryView').hidden = false;
        ['discover', 'movies', 'tv', 'search', 'requests'].forEach(function (view) {
          document.getElementById(view + 'Nav').classList.toggle('active', view === navName);
        });
        document.getElementById('categoryTitle').textContent = category.title;
        document.getElementById('topPageTitle').textContent = category.title;
        document.getElementById('categoryCards').innerHTML = '<div class="empty">Loading…</div>';
        document.getElementById('app').scrollTop = 0;
        loadCategory(category).then(function (items) {
          if (category.type === 'genres' || category.type === 'options') {
            var container = document.getElementById('categoryCards');
            container.innerHTML = '';
            items.forEach(function (item) { container.appendChild(createOptionCard(category, item)); });
          } else {
            renderCards('categoryCards', items, 'Nothing is available in this category.');
          }
          var firstCategoryCard = document.querySelector('#categoryCards .card, #categoryCards .option-card');
          if (firstCategoryCard) firstCategoryCard.focus();
        }).catch(function (error) { notice(error.message); });
      }

      function openFilteredCategory(title, url) {
        if (activeView === 'search') resetSearch();
        activeView = 'category';
        activeCategory = 'filter';
        ['discover', 'search', 'requests'].forEach(function (view) {
          document.getElementById(view + 'View').hidden = true;
        });
        document.getElementById('categoryView').hidden = false;
        document.getElementById('categoryTitle').textContent = title;
        document.getElementById('topPageTitle').textContent = title;
        document.getElementById('categoryCards').innerHTML = '<div class="empty">Loading…</div>';
        document.getElementById('app').scrollTop = 0;
        api(url + (url.indexOf('?') === -1 ? '?page=1' : '&page=1')).then(function (data) {
          renderCards('categoryCards', data.results || [], 'Nothing is available in this category.');
          var firstCategoryCard = document.querySelector('#categoryCards .card, #categoryCards .option-card');
          if (firstCategoryCard) firstCategoryCard.focus();
        }).catch(function (error) { notice(error.message); });
      }

      function runSearch(event) {
        event.preventDefault();
        var query = document.getElementById('searchInput').value.trim();
        if (!query) return;
        notice('Searching…');
        api('/api/v1/search?query=' + encodeURIComponent(query)).then(function (data) {
          var results = data.results.filter(function (item) {
            return item.mediaType === 'movie' || item.mediaType === 'tv';
          });
          renderCards('searchCards', results, 'No movies or shows found.');
          notice('');
          var first = document.querySelector('#searchCards .card');
          if (first) first.focus();
        }).catch(function (error) { notice(error.message); });
      }

      function resetSearch() {
        document.getElementById('searchInput').value = '';
        document.getElementById('globalSearch').value = '';
        document.getElementById('searchCards').innerHTML = '';
      }

      function loadMyRequests() {
        notice('Loading your requests…');
        Promise.all([
          api('/api/v1/request?filter=all&take=20&sort=modified&skip=0'),
          api('/jellyquest/access/claims')
        ]).then(function (results) {
          rememberProfileClaims(results[1].claims);
          var nativeRequests = results[0].results.map(function (request) {
            ownRequestKeys[request.type + ':' + request.media.tmdbId] = true;
            return { mediaType: request.type, tmdbId: request.media.tmdbId, claim: false };
          });
          var nativeKeys = {};
          nativeRequests.forEach(function (request) { nativeKeys[request.mediaType + ':' + request.tmdbId] = true; });
          var claims = (results[1].claims || []).filter(function (claim) {
            return !nativeKeys[claim.mediaType + ':' + claim.tmdbId];
          }).map(function (claim) {
            return { mediaType: claim.mediaType, tmdbId: claim.tmdbId, claim: true, owned: Boolean(claim.jellyfinItemId) };
          });
          return Promise.all(nativeRequests.concat(claims).map(function (request) {
            var path = request.mediaType === 'tv' ? '/api/v1/tv/' : '/api/v1/movie/';
            return api(path + request.tmdbId).then(function (details) {
              details.mediaType = request.mediaType;
              if (request.claim) details.jellyquestClaimState = request.owned ? 'owned' : 'claimed';
              return details;
            }).catch(function () { return null; });
          }));
        }).then(function (items) {
          renderCards('requestCards', items.filter(function (item) { return item; }), 'You have not made any requests yet.');
          notice('');
          var firstRequestCard = document.querySelector('#requestCards .card');
          if (firstRequestCard) firstRequestCard.focus();
        }).catch(function (error) { notice(error.message); });
      }

      function openModal(item) {
        var status = mediaStatus(item);
        selectedItem = item;
        selectedSeasons = [];
        selectedAccess = null;
        selectedAction = 'loading';
        document.getElementById('modalTitle').textContent = itemTitle(item);
        document.getElementById('modalMeta').textContent = (item.mediaType === 'tv' ? 'TV Show' : 'Movie') + (itemYear(item) ? ' · ' + itemYear(item) : '');
        document.getElementById('modalOverview').textContent = item.overview || 'No description is available.';
        setModalAction('loading', 'Checking access…', true);
        document.getElementById('seasonOptions').hidden = true;
        modal.style.display = 'flex';
        document.getElementById('modalClose').focus();
        Promise.resolve(item.jellyquestAccess || loadMediaAccess(item)).then(function (access) {
          if (!isSelectedItem(item) || modal.style.display !== 'flex') return;
          item.jellyquestAccess = access;
          applyPersonalizedAction(item, status, access);
          if (!document.getElementById('modalRequest').disabled) document.getElementById('modalRequest').focus();
        }).catch(function (error) {
          if (!isSelectedItem(item) || modal.style.display !== 'flex') return;
          document.getElementById('modalOverview').textContent = error.message;
          if (status.requestable) {
            selectedAction = 'request';
            renderSeasonOptions(item, status);
          } else {
            setModalAction('unavailable', status.text, true);
          }
        });
        if (item.mediaType === 'tv' && status.requestable && !(item.seasons && item.seasons.length)) {
          api('/api/v1/tv/' + item.id).then(function (details) {
            if (!isSelectedItem(item) || modal.style.display !== 'flex') return;
            details.mediaType = 'tv';
            selectedItem = details;
            document.getElementById('modalOverview').textContent = details.overview || 'No description is available.';
            if (selectedAction === 'request') renderSeasonOptions(details, mediaStatus(details));
          }).catch(function () {
            if (isSelectedItem(item)) renderSeasonOptions(item, status);
          });
        }
      }

      function renderSeasonOptions(item, status) {
        var container = document.getElementById('seasonOptions');
        var requestButton = document.getElementById('modalRequest');
        var seasons = item.mediaType === 'tv' ? (item.seasons || []).filter(function (season) {
          return Number(season.seasonNumber) > 0;
        }) : [];
        container.innerHTML = '';
        container.hidden = !status.requestable || !seasons.length;
        selectedSeasons = seasons.map(function (season) { return Number(season.seasonNumber); });
        seasons.forEach(function (season) {
          var number = Number(season.seasonNumber);
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'season-toggle';
          button.setAttribute('aria-pressed', 'true');
          button.textContent = 'Season ' + number;
          button.addEventListener('click', function () {
            var selected = selectedSeasons.indexOf(number);
            if (selected === -1) selectedSeasons.push(number);
            else selectedSeasons.splice(selected, 1);
            selectedSeasons.sort(function (left, right) { return left - right; });
            button.setAttribute('aria-pressed', selected === -1 ? 'true' : 'false');
            updateSeasonRequestButton(requestButton, seasons.length);
          });
          container.appendChild(button);
        });
        if (item.mediaType === 'tv' && status.requestable) updateSeasonRequestButton(requestButton, seasons.length);
      }

      function updateSeasonRequestButton(button, seasonCount) {
        if (!seasonCount) {
          button.disabled = false;
          button.textContent = 'Request all available seasons';
          return;
        }
        button.disabled = !selectedSeasons.length;
        button.textContent = selectedSeasons.length
          ? 'Request ' + selectedSeasons.length + (selectedSeasons.length === 1 ? ' season' : ' seasons')
          : 'Select at least one season';
      }

      function closeModal() {
        modal.style.display = 'none';
        selectedItem = null;
        selectedSeasons = [];
        selectedAccess = null;
        selectedAction = 'request';
        if (lastFocusedCard && document.body.contains(lastFocusedCard)) lastFocusedCard.focus();
      }

      function submitRequest() {
        if (!selectedItem) return;
        var item = selectedItem;
        var button = document.getElementById('modalRequest');
        if (selectedAction === 'watch') {
          openJellyfinItem(item, selectedAccess);
          return;
        }
        if (selectedAction === 'claim') {
          button.disabled = true;
          button.textContent = selectedAccess && selectedAccess.jellyfinItemId ? 'Adding…' : 'Joining…';
          api('/jellyquest/access', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ mediaType: item.mediaType, tmdbId: itemTmdbId(item) })
          }).then(function (access) {
            var available = Boolean(access.jellyfinItemId);
            closeModal();
            notice(itemTitle(item) + (available ? ' was added to your library.' : ' will be added when it is ready.'));
          }).catch(function (error) {
            button.disabled = false;
            button.textContent = selectedAccess && selectedAccess.jellyfinItemId ? 'Add to My Library' : 'Add when ready';
            document.getElementById('modalOverview').textContent = error.message;
          });
          return;
        }
        if (selectedAction !== 'request') return;
        var body = { mediaId: item.id, mediaType: item.mediaType };
        var requestCreated = false;
        if (item.mediaType === 'tv') body.seasons = selectedSeasons.length ? selectedSeasons.slice() : 'all';
        button.disabled = true;
        button.textContent = 'Requesting…';
        api('/api/v1/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(body)
        }).then(function () {
          requestCreated = true;
          ownRequestKeys[item.mediaType + ':' + itemTmdbId(item)] = true;
          return api('/jellyquest/access', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ mediaType: item.mediaType, tmdbId: itemTmdbId(item) })
          });
        }).then(function () {
          closeModal();
          notice(itemTitle(item) + ' was requested and will be added when ready.');
          item.mediaInfo = item.mediaInfo || {};
          item.mediaInfo.status = 2;
        }).catch(function (error) {
          if (requestCreated) {
            item.mediaInfo = item.mediaInfo || {};
            item.mediaInfo.status = 2;
            closeModal();
            notice(itemTitle(item) + ' was requested, but JellyPass could not record automatic access: ' + error.message);
            return;
          }
          button.disabled = false;
          if (item.mediaType === 'tv') updateSeasonRequestButton(button, (item.seasons || []).length);
          else button.textContent = 'Request movie';
          document.getElementById('modalOverview').textContent = error.message;
        });
      }

      function previewCatalog() {
        var names = [
          'Dune: Part Two', 'Shōgun', 'The Wild Robot', 'Severance', 'Nosferatu',
          'The Last of Us', 'Wicked', 'The Bear', 'A Complete Unknown', 'Andor',
          'Gladiator II', 'The Penguin', 'Flow', 'Silo', 'Conclave', 'Fallout',
          'Anora', 'Slow Horses', 'Furiosa', 'The White Lotus', 'Alien: Romulus',
          'Dark Matter', 'Inside Out 2', 'Hacks', 'The Substance', 'Arcane'
        ];
        var colors = [
          'linear-gradient(145deg,#613e35,#17181d 70%)',
          'linear-gradient(145deg,#234e68,#16171c 70%)',
          'linear-gradient(145deg,#4f3463,#16171c 70%)'
        ];
        return names.map(function (name, index) {
          return {
            id: index + 1,
            mediaType: index % 3 === 1 ? 'tv' : 'movie',
            title: index % 3 === 1 ? undefined : name,
            name: index % 3 === 1 ? name : undefined,
            releaseDate: index % 3 === 1 ? undefined : String(2026 - index % 4) + '-01-01',
            firstAirDate: index % 3 === 1 ? String(2026 - index % 4) + '-01-01' : undefined,
            overview: 'Preview description for ' + name + '. Jellyseerr remains the source for live title details and request status.',
            previewColor: colors[index % colors.length],
            mediaInfo: index === 2 || index === 11 ? { status: 5 }
              : index === 5 ? { status: 2 } : index === 8 ? { status: 3 } : undefined,
            seasons: index % 3 === 1 ? [1, 2, 3].map(function (number) { return { seasonNumber: number }; }) : undefined
          };
        });
      }

      function previewApi(path, options) {
        var catalog = previewCatalog();
        var idMatch = path.match(/\/api\/v1\/(?:movie|tv)\/(\d+)/);
        var accessMatch = path.match(/^\/jellyquest\/access\?mediaType=(movie|tv)&tmdbId=(\d+)/);
        var queryMatch;
        if (path === '/jellyquest/access/claims') {
          return { claims: [{ mediaType: 'movie', tmdbId: 6, userIds: ['preview'], updatedAt: '2026-09-03T00:00:00.000Z' }] };
        }
        if (path === '/jellyquest/access' && options && options.method === 'POST') {
          var claim = JSON.parse(options.body);
          return {
            mediaType: claim.mediaType, tmdbId: claim.tmdbId, claimed: true,
            managed: claim.tmdbId === 12, owned: claim.tmdbId === 12, public: false,
            jellyfinItemId: claim.tmdbId === 12 ? 'preview-item-12' : undefined
          };
        }
        if (accessMatch) {
          var accessId = Number(accessMatch[2]);
          var access = {
            mediaType: accessMatch[1], tmdbId: accessId, claimed: accessId === 6,
            managed: accessId === 12, owned: false, public: accessId === 3
          };
          if (accessId === 3) access.jellyfinItemId = 'preview-item-3';
          if (accessId === 12) access.jellyfinItemId = 'preview-item-12';
          return access;
        }
        if (path.indexOf('/api/v1/discover/genreslider/') === 0) {
          return path.indexOf('/movie') !== -1
            ? [{ id: 28, name: 'Action' }, { id: 35, name: 'Comedy' }, { id: 18, name: 'Drama' }, { id: 27, name: 'Horror' }, { id: 878, name: 'Science Fiction' }]
            : [{ id: 10759, name: 'Action & Adventure' }, { id: 35, name: 'Comedy' }, { id: 18, name: 'Drama' }, { id: 9648, name: 'Mystery' }, { id: 10765, name: 'Sci-Fi & Fantasy' }];
        }
        if (idMatch) return catalog[(Number(idMatch[1]) - 1) % catalog.length];
        if (path.indexOf('/api/v1/media?') === 0) {
          return { results: catalog.slice(0, 12).map(function (item) {
            return { id: item.id, tmdbId: item.id, mediaType: item.mediaType };
          }) };
        }
        if (path.indexOf('/api/v1/request?') === 0) {
          return { results: catalog.slice(3, 13).map(function (item) {
            return { id: item.id, type: item.mediaType, media: { tmdbId: item.id, mediaType: item.mediaType } };
          }) };
        }
        if (path.indexOf('/api/v1/search?') === 0) {
          queryMatch = decodeURIComponent((path.split('query=')[1] || '').replace(/\+/g, ' ')).toLowerCase();
          return { results: catalog.filter(function (item) { return itemTitle(item).toLowerCase().indexOf(queryMatch) !== -1; }) };
        }
        if (path === '/api/v1/request' && options && options.method === 'POST') return { id: 999 };
        if (path.indexOf('/api/v1/discover/tv') === 0) {
          return { page: 1, totalPages: 1, results: catalog.filter(function (item) { return item.mediaType === 'tv'; }) };
        }
        if (path.indexOf('/api/v1/discover/movies') === 0) {
          return { page: 1, totalPages: 1, results: catalog.filter(function (item) { return item.mediaType === 'movie'; }) };
        }
        return { page: 1, totalPages: 2, totalResults: catalog.length, results: catalog };
      }

      function showRequests() {
        document.getElementById('status').style.display = 'none';
        document.getElementById('topbar').style.display = 'flex';
        app.style.display = 'block';
        Promise.all([
          api('/api/v1/request?filter=all&take=100&sort=modified&skip=0').catch(function () { return { results: [] }; }),
          api('/jellyquest/access/claims').catch(function () { return { claims: [] }; })
        ]).then(function (results) {
          (results[0].results || []).forEach(function (request) {
            ownRequestKeys[request.type + ':' + request.media.tmdbId] = true;
          });
          rememberProfileClaims(results[1].claims);
        }).then(loadDiscover).then(focusInitialDiscoverCard);
      }

      function authenticate() {
        retry.style.display = 'none';
        message.textContent = 'Signing in with your Jellyfin profile\u2026';
        if (isPreview) {
          showRequests();
          return;
        }
        if (!params.user || params.user.length > 128 || !params.id || !/^[a-fA-F0-9-]{1,64}$/.test(params.id)) {
          showError('JellyQuest did not provide a valid Jellyfin profile. Return and sign in again.');
          return;
        }
        startBridge().then(showRequests)
          .catch(function (error) {
            showError(error.message || 'Unable to sign in to Jellyseerr.');
          });
      }

      document.getElementById('requestsProfile').addEventListener('click', backToJellyQuest);
      document.getElementById('requestsHomeTab').addEventListener('click', returnToJellyfinHome);
      document.getElementById('requestsTopTab').addEventListener('click', function () { showView('discover'); });
      document.getElementById('discoverNav').addEventListener('click', function () { showView('discover'); });
      document.getElementById('moviesNav').addEventListener('click', function () { openCategory('popular-movies', 'movies'); });
      document.getElementById('tvNav').addEventListener('click', function () { openCategory('popular-tv', 'tv'); });
      document.getElementById('searchNav').addEventListener('click', function () { showView('search'); });
      document.getElementById('requestsNav').addEventListener('click', function () { showView('requests'); });
      document.getElementById('searchForm').addEventListener('submit', runSearch);
      document.getElementById('globalSearchForm').addEventListener('submit', function (event) {
        event.preventDefault();
        document.getElementById('searchInput').value = document.getElementById('globalSearch').value;
        showView('search');
        runSearch(event);
      });
      document.getElementById('modalClose').addEventListener('click', closeModal);
      document.getElementById('modalRequest').addEventListener('click', submitRequest);
      retry.addEventListener('click', authenticate);
      window.addEventListener('keydown', handleBack, true);
      window.addEventListener('keydown', handleDirectionalKey, true);
      window.addEventListener('tizenhwkey', handleBack, true);
      window.addEventListener('message', handleBridgeMessage);
      authenticate();
    })();
  </script>
