name: JellyQuest checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22: the e2e script passes a glob to `node --test`, and glob
          # expansion in the test runner only landed in Node 22. Node 20 is
          # also now deprecated on GitHub-hosted runners.
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Exercise our missing-Web guard without running dependency install scripts.
      - run: npm run postinstall
      - run: npm run lint
      - run: npm test
      # The `playwright` package ships only the driver; browser binaries
      # are always a separate download, so this step is required whether
      # or not npm install runs lifecycle scripts. It fetches just the one
      # browser the suite launches. The specs call chromium.launch() with
      # no headed/display requirement, so no Xvfb wrapper is needed.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
