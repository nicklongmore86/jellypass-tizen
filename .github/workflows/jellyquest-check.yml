name: JellyQuest checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22: the e2e script passes a glob to `node --test`, and glob
          # expansion in the test runner only landed in Node 22. Node 20 is
          # also now deprecated on GitHub-hosted runners.
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      # npm ci --ignore-scripts above deliberately skips Playwright's
      # postinstall browser download, so fetch the one browser the suite
      # actually launches. The specs use chromium.launch() with no
      # headed/display requirement, so no Xvfb wrapper is needed.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
