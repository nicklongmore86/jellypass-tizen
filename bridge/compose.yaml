services:
  jellyquest-request-bridge:
    build:
      context: ..
      dockerfile: bridge/Dockerfile
    image: jellyquest-request-bridge:0.8.0
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      JELLYSEERR_URL: ${JELLYSEERR_URL:?Set the internal Jellyseerr origin}
      PORT: "8080"
    ports:
      - "${JELLYQUEST_BRIDGE_BIND:-0.0.0.0:8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/jellyquest-bridge/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
